        html,*{
            margin:0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
           /* background-image: linear-gradient(145deg)red,yellow,green,white;
            background-image: linear-gradient(to top,red,yellow,green,white);
           background-image: radial-gradient(white 10%,blue,green);*/

        p{
         border: 10px solid blue;

        a:hover{
            cursor:move;
        }
