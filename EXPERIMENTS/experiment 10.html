<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Navbar</title>

<style>
body{
    font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
}

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #222;
    color: white;
    padding: 15px 20px;
    position: relative;
}

.logo{
    font-size: 1.5rem;
    font-weight: bold;
}

.nav-links{
    display: flex;
    list-style: none;
}

.nav-links li{
    margin: 0 15px;
}

.nav-links a{
    text-decoration: none;
    color: white;
    font-size: 1rem;
    transition: 0.3s;
}

.nav-links a:hover{
    color: #ffcc00;
}

.actions a{
    margin-left: 15px;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

/* HAMBURGER */
.hamburger{
    display: none;
    cursor: pointer;
    flex-direction: column;
}

.hamburger span{
    height: 3px;
    width: 25px;
    background: white;
    margin: 4px 0;
    border-radius: 3px;
}

/* MOBILE RESPONSIVE */
@media(max-width:768px){
    .nav-links{
        display: none;
        flex-direction: column;
        width: 100%;
        background: #222;
        position: absolute;
        top: 60px;
        left: 0;
        text-align: center;
        padding: 10px 0;
    }

    .nav-links.show{
        display: flex;
    }

    .nav-links li{
        margin: 10px 0;
    }

    .hamburger{
        display: flex;
    }
}
</style>

<script>
function toggleMenu(){
    document.querySelector(".nav-links").classList.toggle("show");
}
</script>

</head>
<body>

<nav class="navbar">
    <div class="logo">Rajput&Sons</div>

    <div class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Product</a></li>
        <li><a href="#">Categories</a></li>
        <li><a href="#">Deals</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <div class="actions">
        <a href="#">Cart</a>
        <a href="#">Login</a>
    </div>
</nav>

<section style="padding:20px;">
    <h1>Welcome to Rajput & Sons!</h1>
    <p>Your one-stop destination for all shopping needs.</p>
</section>

</body>
</html>
