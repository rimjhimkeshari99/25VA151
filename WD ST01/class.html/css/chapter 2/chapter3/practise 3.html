<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        header{
            background-color: lightblue;
            width: 100%;
            height: 100px;
            margin-bottom: 4px;
        }
        nav{
            color: black;
            background-color: blue;
            border: white;
            margin: 2px 2px 2px 2px;
        }
       #content{
            width: 100%;
            height: 500px;
            background-color: rgb(182, 173, 230);
            margin-top: 4px;
            margin-bottom: 4px;
            display:inline-block
        }
        div{
            height: 100px;
            width: 100px;
            margin: 2px 2px 2px 2px;
            padding: 2px 2px 2px 2px;
            border: 1px solid black;
            background-color: blue;
        }
        footer{
            height: 100px;
            width: 100%;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a>about</a>
            <a>contact</a>
            <a>home</a>
        </nav>
    </header>
    <div id="content">
        <div></div>
        <div></div>
        <div></div>
    </div>
    <footer></footer>
</body>
</html>
